title: INFO 664
description: A GitHub Pages site generated from Markdown

markdown: kramdown
theme: minima
url: "https://craigfahner.github.io"
baseurl: "/INFO-664"

# Collections: optional, but lets you organize pages
collections:
  pages:
    output: true
    permalink: /:path/



defaults:
  - scope:
      path: "README.md"
    values:
      layout: home
      permalink: /