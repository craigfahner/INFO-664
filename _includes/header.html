<header class="site-header">

  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>

    {%- if site.header_pages and site.header_pages.size > 0 %}
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon"></span>
        </label>

        <div class="nav-items">
          {%- for path in site.header_pages -%}
          {%- assign hyperpage = site.pages | where: "path", path | first -%}
          {%- if hyperpage.title %}
          <a class="nav-item" href="{{ hyperpage.url | relative_url }}">{{ hyperpage.title | escape }}</a>
          {%- endif -%}
          {%- endfor %}
        </div>
      </nav>
    {%- endif %}
  </div>
</header>
